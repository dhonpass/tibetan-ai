<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BodYig Translator — English to Tibetan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tibetan:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1020;
    --card: rgba(16, 23, 42, 0.7);
    --border: rgba(255, 255, 255, 0.1);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --input: #0b1225;
    --input-border: #1f2942;
    --btn: #1e293b;
    --btn-border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0b1020;
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.9;
  }
  .blob-purple {
    top: -12rem;
    right: -10rem;
    width: 42rem;
    height: 42rem;
    background: radial-gradient(circle at 30% 30%, rgba(139,92,246,0.5), transparent 60%), rgba(124,58,237,0.3);
  }
  .blob-cyan {
    bottom: -14rem;
    left: -12rem;
    width: 44rem;
    height: 44rem;
    background: radial-gradient(circle at 70% 70%, rgba(6,182,212,0.45), transparent 60%), rgba(14,165,233,0.22);
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 12px 0 28px;
  }
  .logo {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans Tibetan', sans-serif;
    font-size: 20px;
    color: white;
    box-shadow: 0 10px 30px rgba(139,92,246,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    flex-shrink: 0;
  }
  .title h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .title p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 25px 60px -15px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02) inset;
    padding: 28px;
    overflow: hidden;
  }
  #ledTop {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #a78bfa, #22d3ee, #a78bfa, transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
    filter: blur(0.5px);
  }
  #ledTop.active { opacity: 1; }
  .section { margin-bottom: 22px; }
  .label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .textarea {
    width: 100%;
    background: #0b1225;
    border: 1px solid var(--input-border);
    border-radius: 16px;
    padding: 14px 16px;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    line-height: 1.6;
    min-height: 148px;
    resize: vertical;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .textarea::placeholder { color: #4b556b; }
  .textarea:focus {
    outline: none;
    border-color: #7c3aed;
    box-shadow: 0 0 0 4px rgba(124,58,237,0.18);
    background: #0a1122;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 8px 14px;
    background: var(--btn);
    border: 1px solid var(--btn-border);
    border-radius: 10px;
    color: #cbd5e1;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: inherit;
  }
  .btn:hover { background: #273449; border-color: #3f4e66; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .output-wrap {
    background: #0b1225;
    border: 1px solid var(--input-border);
    border-radius: 16px;
    padding: 20px 18px;
    min-height: 148px;
    display: flex;
    align-items: flex-start;
  }
  #outputTibetan {
    font-family: 'Noto Sans Tibetan', 'Inter', sans-serif;
    font-size: 1.8rem;
    line-height: 1.85;
    color: #f1f5f9;
    width: 100%;
    word-break: break-word;
  }
  #outputTibetan.output-placeholder {
    color: #55627a;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-style: italic;
    align-self: center;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #475569;
    box-shadow: 0 0 0 0 rgba(34,197,94,0);
    transition: all 0.3s;
  }
  .dot.active { background: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.5); }
  .dot.error { background: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,0.4); }
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    padding-top: 22px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .btn-primary {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 18px;
    background: #1b2436;
    border: 1px solid #2a364d;
    border-radius: 12px;
    color: #e5edf7;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary:hover:not(:disabled) {
    background: #222f46;
    border-color: #3a4a67;
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
  }
  .btn-primary:active:not(:disabled) { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .icon { width: 18px; height: 18px; stroke-width: 2; }
  .footer-note {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: #64748b;
  }
  @media (max-width: 640px) {
    .card { padding: 22px 18px; border-radius: 20px; }
    #outputTibetan { font-size: 1.5rem; }
    header { margin-bottom: 22px; }
  }

/* Hide ugly scroll */
html,body{overscroll-behavior:contain}
/* If you have a close button, move it outside */
.close-btn, .modal-close, [aria-label="Close"], .btn-close {
  position: absolute !important;
  top: -14px !important;
  right: -14px !important;
  z-index: 9999 !important;
  transform: translate(0,0) !important;
}
</style>
</head>
<body>
  <div class="bg">
    <div class="blob blob-purple"></div>
    <div class="blob blob-cyan"></div>
  </div>

  <div class="container">
    <header>
      <div class="logo" aria-hidden="true">བོད</div>
      <div class="title">
        <h1>BodYig Translator</h1>
        <p>Any Other Language → Tibetan</p>
      </div>
    </header>

    <main class="card">
      <div id="ledTop"></div>

      <div class="section">
        <label class="label" for="inputText">Type Any Language </label>
        <textarea id="inputText" class="textarea" placeholder="Type or paste English here…" spellcheck="false" autofocus></textarea>
        <div class="row">
          <button id="clearBtn" class="btn" type="button">Clear</button>
          <button id="sampleBtn" class="btn" type="button">Sample</button>
        </div>
      </div>

      <div class="section" style="margin-bottom: 8px;">
        <label class="label">Tibetan Translation</label>
        <div class="output-wrap">
          <div id="outputTibetan" class="output-placeholder">Translation will appear here…</div>
        </div>
        <div class="status">
          <div id="statusDot" class="dot"></div>
          <span id="statusText">Ready to translate</span>
        </div>
      </div>

      <div class="actions">
        <button id="copyBtn" class="btn-primary" type="button" disabled>
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          Copy
        </button>
        <button id="savePdfBtn" class="btn-primary" type="button" disabled>
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3M4 20h16a2 2 0 002-2V8a2 2 0 00-2-2h-5l-2-2H7a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Save PDF
        </button>
      </div>
    </main>

    <div class="footer-note">Live Translation requires internet. version 1.0</div>
  </div>

<script>
(function() {
  const inputText = document.getElementById('inputText');
  const outputTibetan = document.getElementById('outputTibetan');
  const statusText = document.getElementById('statusText');
  const statusDot = document.getElementById('statusDot');
  const clearBtn = document.getElementById('clearBtn');
  const sampleBtn = document.getElementById('sampleBtn');
  const copyBtn = document.getElementById('copyBtn');
  const savePdfBtn = document.getElementById('savePdfBtn');
  const ledTop = document.getElementById('ledTop');

  let debounceTimer = null;
  let lastTranslation = '';
  let lastInput = '';

  function flashLED() {
    ledTop.classList.add('active');
    setTimeout(() => ledTop.classList.remove('active'), 700);
  }

  function setStatus(state, message) {
    statusText.textContent = message;
    statusDot.className = 'dot ' + (state || '');
  }

  function displayTranslation(text) {
    lastTranslation = text;
    outputTibetan.textContent = text;
    outputTibetan.classList.remove('output-placeholder');
    copyBtn.disabled = false;
    savePdfBtn.disabled = false;
    flashLED();
  }

  async function googleTranslate(text) {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=bo&dt=t&q=' + encodeURIComponent(text);
    const res = await fetch(url);
    if (!res.ok) throw new Error('gtx');
    const data = await res.json();
    return data[0].map(x => x[0]).join('');
  }

  async function googleTranslateViaProxy(text) {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=bo&dt=t&q=' + encodeURIComponent(text);
    const proxy = 'https://api.allorigins.win/get?url=' + encodeURIComponent(url);
    const res = await fetch(proxy);
    if (!res.ok) throw new Error('proxy');
    const wrap = await res.json();
    const data = JSON.parse(wrap.contents);
    return data[0].map(x => x[0]).join('');
  }

  async function myMemoryTranslate(text) {
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=|bo';
    const res = await fetch(url);
    if (!res.ok) throw new Error('mymemory');
    const data = await res.json();
    return data.responseData.translatedText || '';
  }

  async function translateText(text) {
    if (text === lastInput) return;
    lastInput = text;
    setStatus('active', 'Translating…');
    flashLED();
    try {
      const t1 = await googleTranslate(text);
      if (t1) { displayTranslation(t1); setStatus('active', 'LIVE Translated DONE'); return; }
      throw new Error('empty');
    } catch(e1) {
      try {
        const t2 = await googleTranslateViaProxy(text);
        if (t2) { displayTranslation(t2); setStatus('active', 'Translated via proxy'); return; }
        throw new Error('empty2');
      } catch(e2) {
        try {
          const t3 = await myMemoryTranslate(text);
          displayTranslation(t3);
          setStatus('active', 'Translated via MyMemory');
        } catch(e3) {
          setStatus('error', 'Translation failed. Check connection.');
          outputTibetan.textContent = 'Unable to translate. Please try again.';
          outputTibetan.classList.remove('output-placeholder');
        }
      }
    }
  }

  inputText.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const text = inputText.value.trim();
    if (!text) {
      outputTibetan.textContent = 'Translation will appear here…';
      outputTibetan.classList.add('output-placeholder');
      setStatus('', 'Ready to translate');
      copyBtn.disabled = true;
      savePdfBtn.disabled = true;
      lastTranslation = '';
      lastInput = '';
      return;
    }
    debounceTimer = setTimeout(() => translateText(text), 550);
  });

  clearBtn.addEventListener('click', () => {
    inputText.value = '';
    inputText.dispatchEvent(new Event('input'));
    inputText.focus();
    flashLED();
  });

  sampleBtn.addEventListener('click', () => {
    inputText.value = 'Hello, peace and compassion for all beings.';
    inputText.dispatchEvent(new Event('input'));
    inputText.focus();
  });

  copyBtn.addEventListener('click', async () => {
    if (!lastTranslation) return;
    try {
      await navigator.clipboard.writeText(lastTranslation);
      const orig = copyBtn.innerHTML;
      copyBtn.innerHTML = '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Copied!';
      setTimeout(() => { copyBtn.innerHTML = orig; }, 1800);
      flashLED();
    } catch {}
  });

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  savePdfBtn.addEventListener('click', () => {
    if (!lastTranslation) return;
    const english = inputText.value.trim();
    const tibetan = lastTranslation;
    const w = window.open('', '_blank');
    w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>BodYig Translation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+Tibetan:wght@400;500&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;padding:40px;max-width:800px;margin:0 auto;color:#0b1020}
h1{font-size:22px;margin:0 0 24px;padding-bottom:10px;border-bottom:2px solid #8b5cf6}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:6px}
.box{padding:16px 18px;background:#f8fafc;border-radius:12px;margin-bottom:22px}
.en{border-left:3px solid #64748b;font-size:15px;line-height:1.6}
.bo{border-left:3px solid #8b5cf6;font-family:'Noto Sans Tibetan',sans-serif;font-size:26px;line-height:1.9}
.foot{margin-top:30px;padding-top:12px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;text-align:center}
@media print{body{padding:20px}}
<\/style></head><body>
<h1>BodYig Translator — English to Tibetan</h1>
<div class="label">English</div><div class="box en">${escapeHtml(english)}</div>
<div class="label">Tibetan (བོད་ཡིག)</div><div class="box bo">${escapeHtml(tibetan)}</div>
<div class="foot">Generated ${new Date().toLocaleString()}</div>
<script>window.onload=()=>setTimeout(()=>window.print(),400);<\/script>
</body></html>`);
    w.document.close();
  });

  // initial
  setStatus('', 'Ready to translate');
})();
</script>
</body>
</html>
